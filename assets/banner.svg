<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="50%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#34d399" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="240" x2="900" y2="240" />
  </g>

  <!-- Terminal icon -->
  <g transform="translate(50, 55)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="155" height="105" rx="10" fill="#1e1e2e" stroke="#333" stroke-width="1.5" />
    <!-- Title bar dots -->
    <circle cx="16" cy="14" r="4.5" fill="#ff5f57" />
    <circle cx="30" cy="14" r="4.5" fill="#febc2e" />
    <circle cx="44" cy="14" r="4.5" fill="#28c840" />
    <!-- Terminal prompt -->
    <text x="14" y="48" font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#10b981" font-weight="bold">$</text>
    <text x="28" y="48" font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#a78bfa">lcp</text>
    <!-- Output line -->
    <text x="14" y="68" font-family="SF Mono, Monaco, Consolas, monospace" font-size="11" fill="#666">Model: Qwen3-30B</text>
    <text x="14" y="86" font-family="SF Mono, Monaco, Consolas, monospace" font-size="11" fill="#10b981">Server ready!</text>
    <!-- Blinking cursor -->
    <rect x="14" y="92" width="8" height="2" fill="#a78bfa" opacity="0.8" />
  </g>

  <!-- Main title -->
  <text x="235" y="100" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="42" font-weight="700" fill="url(#accent)" filter="url(#glow)">claude-local</text>

  <!-- Subtitle -->
  <text x="235" y="132" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="17" fill="#94a3b8">Run any LLM with Claude Code &amp; Codex CLI</text>

  <!-- Feature pills -->
  <g transform="translate(235, 152)">
    <!-- Local pill -->
    <rect x="0" y="0" width="120" height="30" rx="15" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.8" />
    <text x="60" y="20" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#10b981" font-weight="500">llama.cpp local</text>

    <!-- OpenRouter pill -->
    <rect x="132" y="0" width="135" height="30" rx="15" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.8" />
    <text x="199" y="20" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#a78bfa" font-weight="500">OpenRouter free</text>

    <!-- Metal pill -->
    <rect x="279" y="0" width="110" height="30" rx="15" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.8" />
    <text x="334" y="20" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#fbbf24" font-weight="500">Metal GPU</text>

    <!-- Multi-provider pill -->
    <rect x="401" y="0" width="130" height="30" rx="15" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.5" />
    <text x="466" y="20" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#94a3b8" font-weight="500">multi-provider</text>
  </g>

  <!-- Bottom tagline -->
  <text x="235" y="230" font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#475569">source ~/.claude_config.zsh &amp;&amp; lcp</text>
  <text x="235" y="252" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#64748b">25+ free models  |  local inference  |  zero config switching</text>

  <!-- Decorative accent line -->
  <rect x="50" y="270" width="800" height="2" rx="1" fill="url(#accent)" opacity="0.3" />
</svg>
