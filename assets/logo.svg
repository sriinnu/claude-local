<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b" />
      <stop offset="100%" style="stop-color:#0f0a2e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#f59e0b" />
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399" />
      <stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <!-- Inner glow for bolt -->
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#fff" stroke-width="1" opacity="0.12" />

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <!-- Terminal body -->
    <rect x="72" y="96" width="368" height="280" rx="20" fill="url(#screenGrad)" />

    <!-- Title bar -->
    <rect x="72" y="96" width="368" height="44" rx="20" fill="#1e1b4b" />
    <rect x="72" y="120" width="368" height="20" fill="#1e1b4b" />

    <!-- Traffic light dots -->
    <circle cx="104" cy="118" r="8" fill="#ff5f57" />
    <circle cx="128" cy="118" r="8" fill="#febc2e" />
    <circle cx="152" cy="118" r="8" fill="#28c840" />

    <!-- Title bar text -->
    <text x="256" y="123" text-anchor="middle" font-family="SF Mono, Monaco, Consolas, monospace" font-size="13" fill="#64748b" font-weight="500">claude-local</text>
  </g>

  <!-- Terminal content -->
  <g>
    <!-- Line 1: prompt -->
    <text x="100" y="178" font-family="SF Mono, Monaco, Consolas, monospace" font-size="20" font-weight="700" fill="url(#promptGrad)">$</text>
    <text x="120" y="178" font-family="SF Mono, Monaco, Consolas, monospace" font-size="20" font-weight="600" fill="#e2e8f0">lcp</text>

    <!-- Line 2: model loading -->
    <text x="100" y="210" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" fill="#64748b">Model:</text>
    <text x="172" y="210" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" fill="#a78bfa">Qwen3-30B</text>

    <!-- Line 3: GPU info -->
    <text x="100" y="236" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" fill="#64748b">GPU:</text>
    <text x="148" y="236" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" fill="#fbbf24">Metal</text>
    <text x="208" y="236" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" fill="#64748b">99 layers</text>

    <!-- Line 4: ready status -->
    <circle cx="106" cy="260" r="5" fill="#10b981" />
    <text x="118" y="265" font-family="SF Mono, Monaco, Consolas, monospace" font-size="15" font-weight="600" fill="#10b981">Ready</text>

    <!-- Cursor block -->
    <rect x="100" y="284" width="12" height="20" rx="2" fill="#a78bfa" opacity="0.7" />
  </g>

  <!-- Lightning bolt (bottom-right, overlapping terminal) -->
  <g transform="translate(340, 268)" filter="url(#boltGlow)">
    <path d="M 28 0 L 8 52 L 30 52 L 16 96 L 68 36 L 42 36 L 60 0 Z"
          fill="url(#boltGrad)" stroke="#fef3c7" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Bottom accent dots (representing providers) -->
  <g transform="translate(176, 420)">
    <circle cx="0" cy="0" r="10" fill="#10b981" opacity="0.9" />
    <circle cx="40" cy="0" r="10" fill="#8b5cf6" opacity="0.9" />
    <circle cx="80" cy="0" r="10" fill="#fbbf24" opacity="0.9" />
    <circle cx="120" cy="0" r="10" fill="#60a5fa" opacity="0.9" />
    <!-- Labels -->
    <text x="0" y="28" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="500">local</text>
    <text x="40" y="28" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="500">free</text>
    <text x="80" y="28" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="500">metal</text>
    <text x="120" y="28" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="500">cloud</text>
  </g>
</svg>
